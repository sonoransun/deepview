<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Deep View SQUID side-channel capture flow">
  <title>Deep View rf-SQUID / dc-SQUID capture flow</title>
  <rect x="0" y="0" width="960" height="320" fill="#0d1117"/>
  <text x="480" y="34" fill="#c9d1d9" font-size="18" font-weight="700" text-anchor="middle">rf-SQUID / dc-SQUID side-channel capture</text>

  <!-- Subject under test -->
  <rect x="24" y="120" width="150" height="80" rx="10" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  <text x="99" y="150" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Subject</text>
  <text x="99" y="168" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">under test</text>
  <text x="99" y="186" fill="#8b949e" font-size="11" text-anchor="middle">mcu / fpga / card</text>

  <!-- SQUID probe -->
  <rect x="214" y="110" width="170" height="100" rx="10" fill="#0f3460" stroke="#16213e" stroke-width="2"/>
  <text x="299" y="142" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">SQUID probe</text>
  <text x="299" y="162" fill="#cfe3ff" font-size="11" text-anchor="middle">dc-squid · rf-squid</text>
  <text x="299" y="180" fill="#cfe3ff" font-size="11" text-anchor="middle">simulated-squid</text>
  <text x="299" y="198" fill="#8b949e" font-size="10" text-anchor="middle">flux → samples @ rate</text>

  <!-- ProbeCapture -->
  <rect x="424" y="110" width="180" height="100" rx="10" fill="#533483" stroke="#0f3460" stroke-width="2"/>
  <text x="514" y="142" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">ProbeCapture</text>
  <text x="514" y="162" fill="#e9defc" font-size="11" text-anchor="middle">samples + rate</text>
  <text x="514" y="180" fill="#e9defc" font-size="11" text-anchor="middle">channel + units</text>
  <text x="514" y="198" fill="#ffd166" font-size="11" font-weight="600" text-anchor="middle">SHA256 chain-of-custody</text>

  <!-- Analysis -->
  <rect x="644" y="60" width="170" height="80" rx="10" fill="#16c79a" stroke="#0f3460" stroke-width="2"/>
  <text x="729" y="92" fill="#06281f" font-size="13" font-weight="700" text-anchor="middle">analysis</text>
  <text x="729" y="110" fill="#06281f" font-size="11" text-anchor="middle">PSD · correlation</text>
  <text x="729" y="126" fill="#06281f" font-size="11" text-anchor="middle">leakage SNR</text>

  <!-- Events -->
  <rect x="644" y="160" width="170" height="44" rx="10" fill="#e94560" stroke="#16213e" stroke-width="2"/>
  <text x="729" y="180" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">EventBus</text>
  <text x="729" y="196" fill="#ffd9df" font-size="10" text-anchor="middle">SideChannelCapture*</text>

  <!-- Artifact store -->
  <rect x="644" y="220" width="170" height="44" rx="10" fill="#0f3460" stroke="#16213e" stroke-width="2"/>
  <text x="729" y="240" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">ArtifactStore</text>
  <text x="729" y="256" fill="#cfe3ff" font-size="10" text-anchor="middle">sidechannel_captures</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <g stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="174" y1="160" x2="210" y2="160"/>
    <line x1="384" y1="160" x2="420" y2="160"/>
    <line x1="604" y1="150" x2="640" y2="110"/>
    <line x1="604" y1="170" x2="640" y2="180"/>
    <line x1="604" y1="190" x2="640" y2="238"/>
  </g>

  <text x="480" y="300" fill="#8b949e" font-size="11" text-anchor="middle">Authorized-testing scope · capture gated by --authorization-statement + --confirm</text>
</svg>
